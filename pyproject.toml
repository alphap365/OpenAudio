[project]
name = "openaudio"
version = "1.0.0"
description = "Lightweight, cross-platform music downloader and offline music player for YouTube Music & Spotify."
readme = "README.md"
authors = [
    { name = "alphap365", email = "arajitpaul2010@gmail.com" },
]
keywords = ["music", "downloader", "spotify", "youtube", "ytmusic", "termux", "tui", "offline-player"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.8.0",
    "textual>=0.50.0",
    "rich>=13.7.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "rapidfuzz>=3.0.0",
    "spotipy>=2.24.0",
]

[project.scripts]
openaudio = "openaudio:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]
