name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version from pyproject.toml, e.g. 1.1.0 or 1.1.0a1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install packaging

      - name: Validate version
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from packaging.version import InvalidVersion, Version
          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)
          pyproject_version = project["project"]["version"]
          input_version = os.environ["INPUT_VERSION"]
          try:
              expected = Version(pyproject_version)
              supplied = Version(input_version)
          except InvalidVersion as exc:
              sys.exit(f"Invalid version: {exc}")
          if expected != supplied:
              sys.exit(
                  f"Version mismatch: pyproject.toml={pyproject_version!r}, "
                  f"input={input_version!r}"
              )
          tag = f"v{pyproject_version}"
          prerelease = expected.is_prerelease or expected.is_devrelease
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={pyproject_version}\n")
              output.write(f"tag={tag}\n")
              output.write(f"is_prerelease={'true' if prerelease else 'false'}\n")
          print(f"Validated version: {pyproject_version}")
          print(f"Release tag: {tag}")
          PY


  package:
    name: Build OpenAudio distributions
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Verify distributions
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30


  create-release:
    name: Create GitHub draft release
    needs: [validate, package]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: release-assets

      - name: List release assets
        run: |
          ls -la release-assets

      - name: Create release tag if missing
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."
          else
            args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --draft
              --title "OpenAudio v${VERSION}"
              --notes "OpenAudio v${VERSION}"
            )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

      - name: Upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber